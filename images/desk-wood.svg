<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <!-- 읽기창 바닥의 나무 책상 무늬. 가로로 긴 나뭇결을 이어 붙여도 이음매가 보이지 않게 stitchTiles를 쓴다 -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.09" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.47  0 0 0 0 0.29  0 0 0 0 0.15  0 0 0 -1.6 1.05"/>
  </filter>
  <filter id="fine" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.6" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 -2.2 1.25"/>
  </filter>
  <rect width="720" height="480" fill="#c9975f"/>
  <rect width="720" height="480" filter="url(#grain)" opacity=".55"/>
  <rect width="720" height="480" filter="url(#fine)" opacity=".35"/>
  <!-- 판자 이음매: 120px마다 한 줄, 판자마다 밝기를 조금씩 다르게 -->
  <rect y="0" width="720" height="120" fill="#fff3df" opacity=".06"/>
  <rect y="240" width="720" height="120" fill="#5a3418" opacity=".06"/>
  <rect y="360" width="720" height="120" fill="#fff3df" opacity=".04"/>
  <g fill="#6b4022" opacity=".45">
    <rect y="119" width="720" height="1.5"/><rect y="239" width="720" height="1.5"/>
    <rect y="359" width="720" height="1.5"/><rect y="479" width="720" height="1"/>
  </g>
  <g fill="#f3d6ad" opacity=".25">
    <rect y="120.5" width="720" height="1"/><rect y="240.5" width="720" height="1"/><rect y="360.5" width="720" height="1"/><rect y="0" width="720" height="1"/>
  </g>
</svg>
